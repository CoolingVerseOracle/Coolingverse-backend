# =====================================================
# Oracle ADB 연결 프로필 — 실행: --spring.profiles.active=oracle
# ⚠️ ADB 권한이 풀리면 아래 3가지를 채워야 한다:
#   1. ADB 콘솔에서 Wallet(지갑) zip 다운로드 → 서버의 안전한 경로에 압축 해제
#   2. TNS_ADMIN 경로를 그 폴더로 지정
#   3. DB 사용자/비밀번호를 환경변수로 주입 (코드에 절대 하드코딩 금지)
# =====================================================

# 접속 주소: <서비스명>은 wallet의 tnsnames.ora에 있는 이름 (보통 <db이름>_high/_medium/_low)
spring.datasource.url=jdbc:oracle:thin:@${ADB_SERVICE_NAME:coolingverse_high}?TNS_ADMIN=${ADB_WALLET_DIR:C:/oracle/wallet}
spring.datasource.username=${ADB_USERNAME:ADMIN}
spring.datasource.password=${ADB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# 테이블은 db/schema.sql 로 직접 만들므로 JPA가 스키마를 건드리지 않게 한다
spring.jpa.hibernate.ddl-auto=none
