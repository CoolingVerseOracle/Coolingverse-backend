spring.application.name=parking-auth

# 관리자 계정 (DB 없이 환경변수에서 읽어옴)
# ADMIN_ID 환경변수가 없으면 기본값 coolingverse8 사용
admin.id=${ADMIN_ID:coolingverse8}
# 비밀번호(cool-verse-8)를 BCrypt로 암호화한 값. 로컬 테스트용 기본값.
# 실제 서비스에서는 OCI 환경변수 ADMIN_PASSWORD_HASH 가 이 값을 덮어씀.
admin.password-hash=${ADMIN_PASSWORD_HASH:$2a$10$9AMYnUwu4dZqJ9q4fko7LupP9i8VNjuWIUBwRPrNcToDahGrVc.gu}
