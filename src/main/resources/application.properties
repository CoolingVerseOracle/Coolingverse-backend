spring.application.name=parking-auth

# 모든 API 앞에 /api 를 붙인다 (예: POST /api/login).
# 팀 합의(2026-08-02): 배포 시 nginx가 /api 를 떼지 않고 그대로 백엔드에 전달하므로,
# 백엔드가 /api 접두사를 직접 받는다. 프론트는 VITE_API_BASE_URL 로 이 접두사를 붙여 호출한다.
server.servlet.context-path=/api

# 관리자 계정 (DB 없이 환경변수에서 읽어옴)

admin.id=${ADMIN_ID:coolingverse8}
# admin.password-hash: 관리자 비밀번호를 BCrypt로 암호화한 값. 로컬 테스트용 기본값.
# 실제 서비스에서는 OCI 환경변수 ADMIN_PASSWORD_HASH 가 이 값을 덮어씀.
admin.password-hash=${ADMIN_PASSWORD_HASH:$2a$10$9AMYnUwu4dZqJ9q4fko7LupP9i8VNjuWIUBwRPrNcToDahGrVc.gu}

# --- DB 설정 (기본 = H2 메모리 DB, 로컬 개발용) ---
# ADB 연결 전까지는 가짜 임시 DB(H2)로 돈다. 엔티티 매핑 검증용이며 재시작하면 비워짐.
# 실제 Oracle 연결은 --spring.profiles.active=oracle 로 전환 (application-oracle.properties 참고)
# NON_KEYWORDS: air_quality의 hour/month 컬럼명이 H2 예약어와 겹치는 것 회피
spring.datasource.url=jdbc:h2:mem:parkingdb;MODE=Oracle;NON_KEYWORDS=HOUR,MONTH,DAY_OF_WEEK
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update

# 배포 및 데이터 활성화 후 서버 내부 readiness 검사에만 사용한다.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
