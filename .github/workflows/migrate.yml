name: ADB Flyway migration
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coolingverse-adb-migration-production
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    env:
      FLYWAY_VERSION: 12.8.1
      ADB_USERNAME: ${{ secrets.ADB_USERNAME }}
      ADB_PASSWORD: ${{ secrets.ADB_PASSWORD }}
      ADB_SERVICE_NAME: ${{ secrets.ADB_SERVICE_NAME }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Flyway command line without containers
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://download.red-gate.com/maven/release/com/redgate/flyway/flyway-commandline/${FLYWAY_VERSION}/flyway-commandline-${FLYWAY_VERSION}-linux-x64.tar.gz" \
            -o /tmp/flyway.tar.gz
          tar -xzf /tmp/flyway.tar.gz -C /tmp
          echo "/tmp/flyway-${FLYWAY_VERSION}" >> "$GITHUB_PATH"
      - name: Configure ADB wallet
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/adb-wallet"
          printf '%s' '${{ secrets.ADB_WALLET_BASE64 }}' | base64 --decode > "$RUNNER_TEMP/wallet.zip"
          unzip -q "$RUNNER_TEMP/wallet.zip" -d "$RUNNER_TEMP/adb-wallet"
      - name: Validate and migrate before application deployment
        env:
          WALLET_DIR: ${{ runner.temp }}/adb-wallet
        run: |
          set -euo pipefail
          flyway \
            -url="jdbc:oracle:thin:@${ADB_SERVICE_NAME}?TNS_ADMIN=${WALLET_DIR}" \
            -user="$ADB_USERNAME" -password="$ADB_PASSWORD" \
            -locations="filesystem:src/main/resources/db/migration" \
            -baselineOnMigrate=true -baselineVersion=1 validate migrate
