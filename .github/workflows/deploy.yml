name: Backend CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 백엔드 재시작이 겹치지 않도록 운영 배포를 직렬화한다.
concurrency:
  group: coolingverse-backend-production
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate production deployment configuration
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate required secrets and variables
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
        run: |
          set -euo pipefail

          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PRIVATE_KEY DEPLOY_KNOWN_HOSTS ADMIN_ID ADMIN_PASSWORD_HASH; do
            test -n "${!name}" || { echo "Missing production value: $name" >&2; exit 1; }
          done

          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          [[ "$ADMIN_ID" =~ ^[A-Za-z0-9._@-]+$ ]]
          [[ "$ADMIN_PASSWORD_HASH" =~ ^\$2[aby]\$[0-9]{2}\$[./A-Za-z0-9]{53}$ ]]

  migrate:
    needs: preflight
    uses: ./.github/workflows/migrate.yml
    secrets: inherit

  deploy:
    name: Test, package, and deploy to OCI Compute
    runs-on: ubuntu-latest
    environment: production
    needs: migrate
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      RELEASE_ID: ${{ github.sha }}-${{ github.run_attempt }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Test and build executable JAR
        run: |
          ./gradlew test --no-daemon
          ./gradlew bootJar --no-daemon

      - name: Select executable JAR
        id: jar
        run: |
          set -euo pipefail
          jar_file="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' -print -quit)"
          test -n "$jar_file"
          echo "path=$jar_file" >> "$GITHUB_OUTPUT"

      - name: Configure the deployment SSH key
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Prepare administrator environment file
        env:
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
        run: |
          set -euo pipefail
          [[ "$ADMIN_ID" =~ ^[A-Za-z0-9._@-]+$ ]]
          [[ "$ADMIN_PASSWORD_HASH" =~ ^\$2[aby]\$[0-9]{2}\$[./A-Za-z0-9]{53}$ ]]

          umask 077
          printf 'ADMIN_ID=%s\nADMIN_PASSWORD_HASH=%s\n' \
            "$ADMIN_ID" "$ADMIN_PASSWORD_HASH" \
            > "$RUNNER_TEMP/admin.env"

      - name: Upload executable JAR and administrator environment
        run: |
          set -euo pipefail
          admin_env="$RUNNER_TEMP/admin.env"
          trap 'rm -f "$admin_env"' EXIT

          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -P "$DEPLOY_PORT" -i "$HOME/.ssh/id_ed25519" \
            "${{ steps.jar.outputs.path }}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/coolingverse-backend-${RELEASE_ID}.jar"

          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -P "$DEPLOY_PORT" -i "$HOME/.ssh/id_ed25519" \
            "$admin_env" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/coolingverse-admin-${RELEASE_ID}.env"

      - name: Activate release and verify health
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_PORT" -i "$HOME/.ssh/id_ed25519" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "RELEASE_ID=${RELEASE_ID} bash -se" <<'REMOTE_SCRIPT'
          set -euo pipefail

          app_root=/home/ubuntu/app
          releases_dir="$app_root/releases"
          archive="/tmp/coolingverse-backend-${RELEASE_ID}.jar"
          release_dir="$releases_dir/$RELEASE_ID"
          release_jar="$release_dir/parking-auth.jar"
          live_jar="$app_root/parking-auth.jar"
          previous_jar="$(readlink -f "$live_jar" 2>/dev/null || true)"
          admin_archive="/tmp/coolingverse-admin-${RELEASE_ID}.env"
          admin_dir=/etc/coolingverse
          admin_pending="$admin_dir/admin.env.${RELEASE_ID}"
          admin_target="$admin_dir/admin.env"

          cleanup() {
            rm -f "$archive" "$admin_archive"
            sudo rm -f "$admin_pending" || true
          }
          trap cleanup EXIT

          test -d "$releases_dir"
          test -f "$archive"
          test -f "$admin_archive"
          test ! -e "$release_dir"
          sudo grep -Fqx 'EnvironmentFile=/etc/coolingverse/admin.env' \
            /etc/systemd/system/coolingverse-backend.service

          sudo install -d -o root -g root -m 0755 "$admin_dir"
          sudo install -o root -g root -m 0600 "$admin_archive" "$admin_pending"
          sudo mv -f "$admin_pending" "$admin_target"
          rm -f "$admin_archive"
          test "$(sudo stat -c '%U:%G %a' "$admin_target")" = 'root:root 600'

          mkdir "$release_dir"
          install -m 0644 "$archive" "$release_jar"
          ln -sfn "$release_jar" "$live_jar"
          rm -f "$archive"

          if ! sudo systemctl restart coolingverse-backend; then
            if test -n "$previous_jar" && test -f "$previous_jar"; then
              ln -sfn "$previous_jar" "$live_jar"
              sudo systemctl restart coolingverse-backend || true
            fi
            exit 1
          fi

          for _ in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 5 \
              http://127.0.0.1:8080/api/actuator/health/readiness > /dev/null; then
              exit 0
            fi
            sleep 5
          done

          if test -n "$previous_jar" && test -f "$previous_jar"; then
            ln -sfn "$previous_jar" "$live_jar"
            sudo systemctl restart coolingverse-backend || true
          fi
          echo 'Backend health check failed; the previous release was restored when available.' >&2
          exit 1
          REMOTE_SCRIPT
