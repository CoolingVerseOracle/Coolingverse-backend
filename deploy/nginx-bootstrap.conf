# 인증서가 아직 없을 때만 사용하는 HTTP 설정.
server {
    listen 80;
    listen [::]:80;
    server_name coolingverse.com www.coolingverse.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 200 'CoolingVerse TLS bootstrap\n'; add_header Content-Type text/plain; }
}
