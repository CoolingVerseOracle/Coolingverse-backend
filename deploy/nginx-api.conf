# Certbot 인증서 발급 후 설치하는 최종 설정.
server {
    listen 80;
    listen [::]:80;
    server_name coolingverse.com www.coolingverse.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://coolingverse.com$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.coolingverse.com;
    ssl_certificate /etc/letsencrypt/live/coolingverse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coolingverse.com/privkey.pem;
    return 301 https://coolingverse.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name coolingverse.com;
    ssl_certificate /etc/letsencrypt/live/coolingverse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coolingverse.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/coolingverse/current;
    index index.html;

    # 운영 외부에서 actuator를 조회하지 못하게 하고 서버 내부 readiness만 허용한다.
    location ^~ /api/actuator/ { return 404; }
    location = /api { return 301 /api/; }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        add_header Cache-Control "no-store" always;
    }
    location ~* \.(?:css|js|mjs|map|svg|ico|png|jpg|jpeg|gif|webp|woff2?)$ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
}
