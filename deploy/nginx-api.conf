# =====================================================
# nginx 설정 — /api 요청을 백엔드(8080)로 전달 (접두사 유지, 팀 합의 2026-08-02)
# 설치: sudo cp nginx-api.conf /etc/nginx/sites-available/coolingverse
#       sudo ln -s /etc/nginx/sites-available/coolingverse /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
# ※ 프론트 정적 파일 서빙 블록은 프론트 배포 단계에서 이 파일에 추가한다
# =====================================================
server {
    listen 80;
    server_name _;

    # /api 로 시작하는 요청을 백엔드로 그대로 전달
    # proxy_pass에 경로를 붙이지 않아야 /api 접두사가 유지된 채 전달됨
    # (백엔드가 server.servlet.context-path=/api 로 접두사를 직접 처리)
    location /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # (프론트 배포 전 임시) 루트 접근 시 안내
    location = / {
        return 200 'CoolingVerse backend is running. API: /api\n';
        add_header Content-Type text/plain;
    }
}
